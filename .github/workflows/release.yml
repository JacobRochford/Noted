name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Noted.sln

      - name: Build
        run: dotnet build Noted.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Noted.Tests/Noted.Tests.csproj --configuration Release --no-build --no-restore

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag.TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Mark as pre-release if tag contains a pre-release identifier (e.g. -beta.1, -alpha, -rc.1)
          $isPrerelease = $tag -match '-'
          "PRERELEASE=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Noted.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "Noted-${{ steps.version.outputs.VERSION }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: Noted-${{ steps.version.outputs.VERSION }}-win-x64.zip
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
